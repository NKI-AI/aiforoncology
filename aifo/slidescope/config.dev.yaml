# SlideScope development configuration
# Server configuration
server:
  port: "3000"
  host: "0.0.0.0"
  environment: "development"
  # CORS configuration
  cors:
    enabled: true
    allowOrigins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"
    allowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowHeaders:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
    allowCredentials: true
    maxAge: 86400 # 24 hours
# Database configuration
database:
  url: "sqlite:///slidescope_dev.db"
# Authentication configuration
auth:
  jwtSecret: "dev-secret-key-for-development"
  jwtAlgorithm: "HS256"
  jwtExpirationMinutes: 5 # 5 minutes for the JWT token
  jwtRefreshExpirationMinutes: 30 # 30 minutes for the refresh token
  cookie:
    name: "_auth"
    path: "/"
    httpOnly: true
    secure: false
    sameSite: "lax"
# Storage configuration
storage:
  slidesDir: "./slides"
  masksDir: "./masks"
  cacheSize: 100
# Logging configuration
logging:
  level: "debug" # More verbose logging in development 
