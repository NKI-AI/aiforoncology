# SlideInsight Sample Configuration File
# Copy this file to config.yaml and modify as needed
server:
  port: "3000"
  host: "localhost"
  base_path: "" # Set to "/slideinsight" if serving under a subdirectory
  environment: "development" # Options: development, production
  static_assets_dir: "./dist" # Directory with static web assets
  cors:
    enabled: true
    allow_origins:
      - "*"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow_headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
    expose_headers: []
    allow_credentials: true
    max_age: 86400
database:
  url: "sqlite:///slideinsight.db"
auth:
  jwt_secret: "change-this-in-production" # JWT signing secret
  jwt_algorithm: "HS256" # JWT signing algorithm
  jwt_expiration_minutes: 5 # 5 minutes for the JWT token
  jwt_refresh_expiration_minutes: 30 # 30 minutes for the refresh token
  cookie:
    name: "_auth"
    path: "/"
    http_only: true
    secure: false # Set to true for HTTPS
    same_site: "lax"
# Email configuration
email:
  provider: "console" # Options: "console" or "ses"
  ses:
    region: "us-east-1" # AWS region for SES
    from_address: "noreply@yourdomain.com" # Verified sender email
    from_name: "SlideInsight" # Display name for emails
storage:
  slides_dir: "./data/slides" # Directory for slide storage
  masks_dir: "./data/masks" # Directory for mask storage
  cache_size: 100 # Number of slides to keep in memory cache
logging:
  level: "info" # Options: debug, info, warn, error 
