[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_serve"
version = "0.1.0"
description = "LLM serving infrastructure"
requires-python = ">=3.8"
dependencies = [
    "vllm",
    "openai",
    "click",
]

[project.scripts]
llm-chat = "client.commands:main"

[tool.setuptools]
packages = ["client", "serving"]